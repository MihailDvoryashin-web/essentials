[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "essentials"
version = "0.1.0"
description = "Essentials Stage 1 GMGN token alerts"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1", "Pillow>=11,<12", "solders>=0.26,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
essentials = "essentials.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/essentials"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
